[package]
name        = "shel"
version     = "0.1.0"
edition     = "2021"
description = "Shell history manager with fuzzy TUI search"
license     = "MIT"
authors     = ["Aditya"]

[[bin]]
name = "shel"
path = "src/main.rs"

[dependencies]
rusqlite           = { version = "0.40.0", features = ["bundled"] }
clap               = { version = "4.6.1",  features = ["derive"] }
uuid               = { version = "1.23.1", features = ["v4"] }
chrono             = "0.4.44"
anyhow             = "1.0.102"
dirs               = "6.0.0"
serde              = { version = "1.0.228", features = ["derive"] }
serde_json         = "1.0.150"
gethostname        = "1.1.0"
ratatui            = "0.30.0"
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
nucleo = "0.5"

[profile.release]
opt-level      = 3
lto            = "thin"
codegen-units  = 1
strip          = true

[package.metadata.deb]
maintainer           = "Aditya"
copyright            = "2025, Aditya"
license-file         = ["LICENSE", "0"]
extended-description = "shel records shell history to SQLite and provides a TUI picker (Ctrl-R replacement)."
depends              = "$auto"
section              = "utils"
priority             = "optional"
assets               = [
    ["target/release/shel", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/shel", dest = "/usr/bin/shel", mode = "755" },
]
