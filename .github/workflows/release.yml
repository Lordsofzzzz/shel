name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: cargo build --release

      - run: |
          cd target/release
          tar czf "shel-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz" shel

      - uses: softprops/action-gh-release@v2
        with:
          files: target/release/shel-*.tar.gz
          generate_release_notes: true
